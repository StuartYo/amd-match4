# Manual only: builds the challenge image and pushes it to GHCR.
# After the first push, set the package visibility to Public in GitHub settings.
# Do not write the resulting image reference into any public file.
name: build-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: image tag
        required: true
        default: v1
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (base image is ~20 GB compressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo systemctl stop docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build (no squash, linux/amd64)
        run: |
          IMG=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/wa4:${{ inputs.tag }}
          docker build --platform linux/amd64 -t "$IMG" .
          docker run --rm --entrypoint python3 "$IMG" -c "import torch;assert torch.version.hip, torch.__version__;print(torch.__version__)"
          docker image inspect "$IMG" --format '{{.Size}}' | awk '{printf "uncompressed size: %.1f GiB\n", $1/1073741824}'
          docker push "$IMG"
